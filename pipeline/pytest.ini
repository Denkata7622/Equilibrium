[pytest]
# Windows: pipeline.py / integrate.py правят sys.stdout.reconfigure() при import,
# което затваря pytest's fd-capture buffer → cascading "I/O operation on closed file".
# --capture=no заобикаля проблема изцяло (тестовете работят, output не се прихваща).
addopts = --capture=no -p no:cacheprovider
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# addopts = -v --tb=short --strict-markers